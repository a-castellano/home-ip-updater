name: "windmaker-home-ip-updater"
arch: "aarch64"
platform: "linux"
version: "v0.0.3"
section: "default"
priority: "extra"
provides:
  - windmaker-home-ip-updater
maintainer: "Álvaro Castellano Vela <alvaro@windmaker.net>"
description: |
  This program updates home domain IP
vendor: "Windmaker"
homepage: "https://git.windmaker.net/a-castellano/home-ip-updater"
license: "GPLV3"
changelog: "changelog.yaml"
contents:
  - src: ../../home-ip-updater
    dst: /usr/local/bin/windmaker-home-ip-updater
  - src: ../deb/default/windmaker-home-ip-updater
    dst: /etc/default/windmaker-home-ip-updater-example
  - src: ../deb/systemd/windmaker-home-ip-updater.service
    dst: /usr/lib/systemd/system/windmaker-home-ip-updater.service
overrides:
  deb:
    scripts:
      postinstall: ../deb/scripts/postinstall.sh
